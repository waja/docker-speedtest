---
name: Docker Image CI

run-name: Docker Image CI ${{ inputs.test_id || inputs.image_version || github.ref_name }}

# checkov:skip=CKV_GHA_7: The release workflow needs test-only workflow inputs.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish images after tests (false runs tests only)"
        required: false
        type: boolean
        default: true
      source_ref:
        description: "Commit or ref to check out for release validation"
        required: false
        type: string
        default: ""
      test_id:
        description: "Optional unique run name used by release automation"
        required: false
        type: string
        default: ""
      image_version:
        description: "Override the image version for release automation"
        required: false
        type: string
        default: ""
  push:
    branches:
      - $default-branch
      - development
      - master
    tags:
      - "*.*.*-*"
  # Run tests for any PRs
  pull_request:
  schedule:
    - cron: "43 10 * * 4"

# Prevent two runs for the same branch or tag from publishing concurrently.
concurrency:
  group: >-
    docker-image-${{ inputs.publish == false && inputs.test_id ||
      inputs.image_version || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: speedtest

jobs:
  super-linter:
    name: super-linter
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
      - name: Lint Code Base
        uses: super-linter/super-linter@v9.0.0
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
  shiftleft:
    name: shiftleft
    outputs:
      build_date: ${{ steps.metadata.outputs.build_date }}
      build_version: ${{ steps.metadata.outputs.build_version }}
      vcs_ref: ${{ steps.metadata.outputs.vcs_ref }}
      vcs_url: ${{ steps.metadata.outputs.vcs_url }}
      vcs_branch: ${{ steps.metadata.outputs.vcs_branch }}
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Prepare image metadata
        id: metadata
        env:
          BUILD_VERSION_INPUT: ${{ inputs.image_version }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          HEAD_REF_INPUT: ${{ github.head_ref }}
          REF_NAME_INPUT: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          vcs_branch=""
          if [[ "$SOURCE_REF_INPUT" == refs/heads/* ]]; then
            vcs_branch="${SOURCE_REF_INPUT#refs/heads/}"
          elif [[ "$SOURCE_REF_INPUT" == refs/remotes/origin/* ]]; then
            vcs_branch="${SOURCE_REF_INPUT#refs/remotes/origin/}"
          elif [[ -n "$SOURCE_REF_INPUT" ]]; then
            # An unqualified ref is only a branch when it resolves uniquely
            # to a branch, not when a tag with the same name also exists.
            if [[ "$SOURCE_REF_INPUT" != refs/* ]] &&
              git show-ref --verify --quiet "refs/remotes/origin/$SOURCE_REF_INPUT" &&
              ! git show-ref --verify --quiet "refs/tags/$SOURCE_REF_INPUT"; then
              vcs_branch="$SOURCE_REF_INPUT"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            vcs_branch="${GITHUB_REF#refs/heads/}"
          elif [[ -n "$HEAD_REF_INPUT" ]]; then
            vcs_branch="$HEAD_REF_INPUT"
          fi

          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "build_version=${BUILD_VERSION_INPUT:-$(git describe --tags --always)}"
            echo "vcs_ref=$(git rev-parse --short HEAD)"
            echo "vcs_url=$(git config --get remote.origin.url)"
            echo "vcs_branch=$vcs_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Perform ShiftLeft Scan
        uses: ShiftLeftSecurity/scan-action@v1.3.0
        env:
          WORKSPACE: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_AUTO_BUILD: true
        with:
          output: reports
          # Scan auto-detects the languages in your project. To override uncomment the below variable and set the type
          # type: credscan,java
          # type: python
      - name: Upload report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports
  test-build:
    needs:
      - super-linter
      - shiftleft
    outputs:
      tested_sha: ${{ steps.build_metadata.outputs.vcs_sha }}
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0

      - name: Prepare build commit metadata
        id: build_metadata
        env:
          BUILD_VERSION_INPUT: ${{ inputs.image_version }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          HEAD_REF_INPUT: ${{ github.head_ref }}
          REF_NAME_INPUT: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          vcs_branch=""
          if [[ "$SOURCE_REF_INPUT" == refs/heads/* ]]; then
            vcs_branch="${SOURCE_REF_INPUT#refs/heads/}"
          elif [[ "$SOURCE_REF_INPUT" == refs/remotes/origin/* ]]; then
            vcs_branch="${SOURCE_REF_INPUT#refs/remotes/origin/}"
          elif [[ -n "$SOURCE_REF_INPUT" ]]; then
            # An unqualified ref is only a branch when it resolves uniquely
            # to a branch, not when a tag with the same name also exists.
            if [[ "$SOURCE_REF_INPUT" != refs/* ]] &&
              git show-ref --verify --quiet "refs/remotes/origin/$SOURCE_REF_INPUT" &&
              ! git show-ref --verify --quiet "refs/tags/$SOURCE_REF_INPUT"; then
              vcs_branch="$SOURCE_REF_INPUT"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            vcs_branch="${GITHUB_REF#refs/heads/}"
          elif [[ -n "$HEAD_REF_INPUT" ]]; then
            vcs_branch="$HEAD_REF_INPUT"
          fi

          {
            echo "vcs_sha=$(git rev-parse HEAD)"
            echo "vcs_ref=$(git rev-parse --short HEAD)"
            echo "build_version=${BUILD_VERSION_INPUT:-$(git describe --tags --always)}"
            echo "vcs_branch=$vcs_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Build the Docker image
        id: docker_test
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          tags: localhost:5000/foobar/${{ env.IMAGE_NAME }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ needs.shiftleft.outputs.build_date }}
            BUILD_VERSION=${{ steps.build_metadata.outputs.build_version }}
            VCS_REF=${{ steps.build_metadata.outputs.vcs_ref }}
            VCS_URL=${{ needs.shiftleft.outputs.vcs_url }}
            VCS_BRANCH=${{ steps.build_metadata.outputs.vcs_branch }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.run_number }}
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
  test:
    name: Run test
    needs:
      - test-build
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.run_number }}
          path: /tmp
      - name: Load image and push to local registry
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          docker image ls -a
          docker push localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Inspect the Docker image
        run: |
          docker buildx imagetools inspect localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Test the Docker image
        run: |
          CONTAINER_OUTPUT=$(docker run --rm localhost:5000/foobar/${{ env.IMAGE_NAME }} -h)
          echo "Container output: $CONTAINER_OUTPUT"
          echo "Container output (quoted): '$CONTAINER_OUTPUT'"

          TEST_STRING=$(echo "${CONTAINER_OUTPUT}" | head -1 | cut -d' ' -f2 | tr -d '\r')
          echo "Extracted test string: '$TEST_STRING'"

          if ! [ "${TEST_STRING}" = "speedtest-cli" ]; then
            echo "ERROR: Expected 'speedtest-cli' but got '$TEST_STRING'"
            exit 1
          fi
  dockle:
    name: Run Dockle tests
    needs:
      - test-build
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.run_number }}
          path: /tmp
      - name: Load image and push to local registry
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          docker image ls -a
          docker push localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Run dockle container image linter
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: "registry:5000/foobar/${{ env.IMAGE_NAME }}"
          insecure: true
          format: "sarif"
          exit-code: "1"
          exit-level: "warn"
          ignore: "CIS-DI-0001,CIS-DI-0010,DKL-DI-0006"
          output: sarif-reports
      - name: Upload Reports
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "sarif-reports"
  trivy:
    name: Run Trivy tests
    needs:
      - test-build
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.run_number }}
          path: /tmp
      - name: Load image and push to local registry
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          docker image ls -a
          docker push localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost:5000/foobar/${{ env.IMAGE_NAME }}
          format: "template"
          template: "@/contrib/sarif.tpl"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Upload Reports
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-results.sarif"
  anchore:
    name: Run Anchore tests
    needs:
      - test-build
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.run_number }}
          path: /tmp
      - name: Load image and push to local registry
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          docker image ls -a
          docker push localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Run the Anchore scan action itself with GitHub Advanced Security code scanning integration enabled
        uses: anchore/scan-action@v7.4.2
        with:
          image: localhost:5000/foobar/${{ env.IMAGE_NAME }}
          acs-report-enable: true
          severity-cutoff: critical
          fail-build: false
          output-file: "./results.sarif"
      - name: Move reports
        run: mkdir -p sarif-reports && cp ./results.sarif ./sarif-reports/
      - name: Upload Reports
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "sarif-reports"
  release-docker:
    name: Release Docker images
    needs:
      - test-build
      - test
      - dockle
      - trivy
      - anchore
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test-build.outputs.tested_sha }}
          fetch-depth: 0

      - name: Prepare image metadata
        id: metadata
        env:
          BUILD_VERSION_INPUT: ${{ inputs.image_version }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          HEAD_REF_INPUT: ${{ github.head_ref }}
          REF_NAME_INPUT: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          vcs_branch=""
          if [[ "$SOURCE_REF_INPUT" == refs/heads/* ]]; then
            vcs_branch="${SOURCE_REF_INPUT#refs/heads/}"
          elif [[ "$SOURCE_REF_INPUT" == refs/remotes/origin/* ]]; then
            vcs_branch="${SOURCE_REF_INPUT#refs/remotes/origin/}"
          elif [[ -n "$SOURCE_REF_INPUT" ]]; then
            # An unqualified ref is only a branch when it resolves uniquely
            # to a branch, not when a tag with the same name also exists.
            if [[ "$SOURCE_REF_INPUT" != refs/* ]] &&
              git show-ref --verify --quiet "refs/remotes/origin/$SOURCE_REF_INPUT" &&
              ! git show-ref --verify --quiet "refs/tags/$SOURCE_REF_INPUT"; then
              vcs_branch="$SOURCE_REF_INPUT"
            fi
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            vcs_branch="${GITHUB_REF#refs/heads/}"
          elif [[ -n "$HEAD_REF_INPUT" ]]; then
            vcs_branch="$HEAD_REF_INPUT"
          fi

          {
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "build_version=${BUILD_VERSION_INPUT:-$(git describe --tags --always)}"
            echo "vcs_ref=$(git rev-parse --short HEAD)"
            echo "vcs_url=$(git config --get remote.origin.url)"
            echo "vcs_branch=$vcs_branch"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare
        id: prep
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          IMAGE_VERSION_INPUT: ${{ inputs.image_version }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          USER="${GITHUB_REPOSITORY_OWNER}"
          IMAGE_NAME="$(echo '${{ github.repository }}' | awk -F '/' '{print $2}' | sed  s/docker-//)"
          DOCKER_IMAGE="${USER}/${IMAGE_NAME}"
          VERSION=edge
          # running on a tag
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # running on a branch
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            VERSION="${GITHUB_REF#refs/heads/}"
          fi
          # running on schedule
          # shellcheck disable=SC2050
          if [ "${{ github.event_name }}" = "schedule" ]; then
            VERSION=nightly
          fi
          # running on master branch
          if [ "$VERSION" = "master" ]; then
            VERSION=latest
          fi
          # Release automation can run the workflow from the default branch
          # while explicitly checking out the tested merge commit.
          if [[ -n "$IMAGE_VERSION_INPUT" ]]; then
            VERSION="$IMAGE_VERSION_INPUT"
          fi
          TAGS="${DOCKER_IMAGE}:${VERSION}"
          if [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\-[0-9]{1,3}$ ]]; then
            REALEASE_TAG=true
          fi
          TAGS_INT="$TAGS"
          TAGS=""
          if [ "$DOCKERHUB_USERNAME" != '' ] && [ "$DOCKERHUB_TOKEN" != '' ]; then
            if [ "$REALEASE_TAG" = "true" ]; then
              TAGS="$TAGS_INT,${DOCKER_IMAGE}:latest"
            else
              TAGS="$TAGS_INT"
            fi
          fi
          if [ "$GITHUB_TOKEN" != '' ]; then
            if [ "$REALEASE_TAG" = "true" ]; then
              TAGS="$TAGS,ghcr.io/$TAGS_INT,ghcr.io/${DOCKER_IMAGE}:latest"
            else
              TAGS="$TAGS,ghcr.io/$TAGS_INT"
            fi
          fi
          if [ "$QUAY_USERNAME" != '' ] && [ "$QUAY_TOKEN" != '' ]; then
            if [ "$REALEASE_TAG" = "true" ]; then
              TAGS="$TAGS,quay.io/$TAGS_INT,quay.io/${DOCKER_IMAGE}:latest"
            else
              TAGS="$TAGS,quay.io/$TAGS_INT"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "skip_publish=false" >> "$GITHUB_OUTPUT"

          # Workflow-level concurrency serializes runs for this ref. A second
          # run must also avoid publishing if an earlier run already succeeded.
          if [[ "$PUBLISH_INPUT" != "false" && \
                "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}-[0-9]{1,3}$ ]]; then
            source_sha="${SOURCE_REF_INPUT:-$GITHUB_SHA}"
            publish_title="Docker Image CI release-publish-$VERSION-$source_sha"
            run_lines=$(gh api --paginate --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/docker.image.yml/runs" \
              -F per_page=100 \
              --jq '.workflow_runs[] | {id,event,head_sha,head_branch,display_title,conclusion}')
            successful=$(jq -s --arg sha "$source_sha" --arg tag "$VERSION" \
              --arg title "$publish_title" --argjson current "$GITHUB_RUN_ID" '
                [.[] | select(
                  .id != $current
                  and .conclusion == "success"
                  and (
                    ((.head_branch == $tag) and (.head_sha == $sha)
                      and (.event == "push" or .event == "workflow_dispatch"))
                    or .display_title == $title
                  )
                )] | length
              ' <<< "$run_lines")
            if [[ "$successful" -gt 0 ]]; then
              echo "A successful image run already exists for $VERSION at $source_sha."
              echo "skip_publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.IMAGE_NAME }}-${{ github.run_number }}
          path: /tmp

      - name: Load image from test job
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to ghcr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.event_name != 'pull_request' && env.GITHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${USER}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Login to DockerHub Container Registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to Quay Container Registry
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        if: ${{ github.event_name != 'pull_request' && env.QUAY_USERNAME != '' && env.QUAY_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ env.QUAY_TOKEN }}

      - name: Test
        id: docker_test
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            BUILD_VERSION=${{ steps.metadata.outputs.build_version }}
            VCS_REF=${{ steps.metadata.outputs.vcs_ref }}
            VCS_URL=${{ steps.metadata.outputs.vcs_url }}
            VCS_BRANCH=${{ steps.metadata.outputs.vcs_branch }}

      - name: Build and push
        if: steps.prep.outputs.skip_publish != 'true'
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
          tags: |
            ${{ steps.prep.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            BUILD_VERSION=${{ steps.metadata.outputs.build_version }}
            VCS_REF=${{ steps.metadata.outputs.vcs_ref }}
            VCS_URL=${{ steps.metadata.outputs.vcs_url }}
            VCS_BRANCH=${{ steps.metadata.outputs.vcs_branch }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
