---
name: Release

# checkov:skip=CKV_GHA_7: A validated tag input is required for releases.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. 2.1.3-35"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Merge development and create tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="repos/$REPOSITORY"

          # Match the version-build format used by Docker Image CI.
          tag_pattern='^[0-9]{1,3}\.[0-9]{1,3}\.'
          tag_pattern+='[0-9]{1,3}-[0-9]{1,3}$'
          if [[ ! "$RELEASE_TAG" =~ $tag_pattern ]]; then
            echo "::error::Invalid tag '$RELEASE_TAG'. Use format 2.1.3-35."
            exit 1
          fi

          if gh api "$API/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$RELEASE_TAG' already exists."
            exit 1
          fi

          echo "Validated tag: $RELEASE_TAG"

      - name: Check branches and prepare pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="repos/$REPOSITORY"

          master_sha=$(gh api "$API/git/ref/heads/master" --jq '.object.sha')
          development_sha=$(gh api "$API/git/ref/heads/development" \
            --jq '.object.sha')

          comparison=$(gh api "$API/compare/master...development")
          ahead=$(jq -r '.ahead_by' <<< "$comparison")
          behind=$(jq -r '.behind_by' <<< "$comparison")

          # development must contain at least one commit not on master.
          # master-only commits are allowed; the PR mergeability check below
          # determines whether the two branch histories can be combined.
          if [[ "$ahead" == "0" ]]; then
            echo "::error::development has no new commits to release."
            exit 1
          fi

          echo "development ahead by $ahead; master ahead by $behind commits."

          pr_number=$(gh pr list --repo "$REPOSITORY" --state open \
            --base master --head development \
            --json number --jq '.[0].number // empty')

          if [[ -z "$pr_number" ]]; then
            pr_url=$(gh pr create --repo "$REPOSITORY" \
              --base master --head development \
              --title "Release: development to master" \
              --body "Automated release PR for the requested tag.")
            pr_number=${pr_url##*/}
          fi

          {
            echo "number=$pr_number"
            echo "master_sha=$master_sha"
            echo "development_sha=$development_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for CI on development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.development_sha }}
        run: |
          set -euo pipefail

          # A workflow_dispatch-created PR does not reliably trigger a new
          # pull_request run when GITHUB_TOKEN created it. Gate on the
          # Docker Image CI run for this exact development commit instead.
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            runs=$(gh run list --repo "$REPOSITORY" \
              --workflow docker.image.yml --branch development \
              --commit "$EXPECTED_HEAD" --limit 20 \
              --json databaseId,event,status,conclusion,headSha)
            run=$(jq -c --arg sha "$EXPECTED_HEAD" \
              '[.[] | select(.event == "push" and .headSha == $sha)]\
               | .[0] // empty' <<< "$runs")

            if [[ -n "$run" ]]; then
              status=$(jq -r '.status' <<< "$run")
              conclusion=$(jq -r '.conclusion // empty' <<< "$run")
              run_id=$(jq -r '.databaseId' <<< "$run")

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "::error::Docker Image CI run $run_id ended: $conclusion"
                  exit 1
                fi
                echo "Docker Image CI passed for $EXPECTED_HEAD."
                exit 0
              fi

              echo "Waiting for Docker Image CI run $run_id ($status)."
            else
              echo "Waiting for Docker Image CI run for $EXPECTED_HEAD."
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for Docker Image CI (30 minutes)."
          exit 1

      - name: Check mergeability and merge pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.development_sha }}
          EXPECTED_BASE: ${{ steps.pr.outputs.master_sha }}
        run: |
          set -euo pipefail
          API="repos/$REPOSITORY"

          current_head=$(gh api "$API/git/ref/heads/development" \
            --jq '.object.sha')
          current_base=$(gh api "$API/git/ref/heads/master" \
            --jq '.object.sha')
          if [[ "$current_head" != "$EXPECTED_HEAD" || \
                "$current_base" != "$EXPECTED_BASE" ]]; then
            echo "::error::development or master changed during release."
            echo "Restart the workflow to release the updated branch state."
            exit 1
          fi

          # GitHub calculates mergeability asynchronously after PR creation.
          mergeable="unknown"
          for attempt in {1..24}; do
            pr=$(gh api "$API/pulls/$PR_NUMBER")
            pr_head=$(jq -r '.head.sha' <<< "$pr")
            pr_base=$(jq -r '.base.sha' <<< "$pr")
            mergeable=$(jq -r '.mergeable // "unknown"' <<< "$pr")

            if [[ "$pr_head" != "$EXPECTED_HEAD" || \
                  "$pr_base" != "$EXPECTED_BASE" ]]; then
              echo "::error::The pull request head or base changed."
              exit 1
            fi
            if [[ "$mergeable" == "true" ]]; then
              break
            fi
            if [[ "$mergeable" == "false" ]]; then
              echo "::error::The branches have merge conflicts."
              echo "Resolve conflicts and restart the release workflow."
              exit 1
            fi
            sleep 5
          done

          if [[ "$mergeable" != "true" ]]; then
            echo "::error::GitHub could not determine PR mergeability."
            exit 1
          fi

          result=$(gh api --method PUT "$API/pulls/$PR_NUMBER/merge" \
            -f "sha=$EXPECTED_HEAD" -f "merge_method=merge")
          if [[ $(jq -r '.merged' <<< "$result") != "true" ]]; then
            echo "::error::GitHub did not merge PR #$PR_NUMBER."
            jq -r '.message // "No merge details returned."' <<< "$result"
            exit 1
          fi

          merge_sha=$(jq -r '.sha' <<< "$result")
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "Merged PR #$PR_NUMBER as $merge_sha"

      - name: Create tag on master merge commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          API="repos/$REPOSITORY"

          # Never overwrite an existing tag.
          if gh api "$API/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$RELEASE_TAG' already exists."
            exit 1
          fi

          master_sha=$(gh api "$API/git/ref/heads/master" --jq '.object.sha')
          if [[ -z "$MERGE_SHA" || "$master_sha" != "$MERGE_SHA" ]]; then
            echo "::error::master no longer points to the merge commit."
            echo "Refusing to create a tag on a different commit."
            exit 1
          fi

          gh api --method POST "$API/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$MERGE_SHA"
          echo "Created $RELEASE_TAG at $MERGE_SHA"

      - name: Start Docker image CI for the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN tag creation does not trigger push workflows.
          # workflow_dispatch explicitly starts the test-and-publish pipeline.
          gh workflow run docker.image.yml \
            --repo "$REPOSITORY" --ref "$RELEASE_TAG"
          echo "Started Docker Image CI for $RELEASE_TAG"
