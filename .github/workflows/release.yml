name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example 2.1.3-35)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Merge development and create tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag and release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # This repository uses version-build tags such as 2.1.3-34.
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "::error::Invalid tag '$RELEASE_TAG'. Expected version-build format, e.g. 2.1.3-35."
            exit 1
          fi

          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$RELEASE_TAG' already exists."
            exit 1
          fi

          echo "Validated tag: $RELEASE_TAG"

      - name: Check branches and existing pull requests
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          master_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          development_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/development" --jq '.object.sha')

          if [[ "$master_sha" == "$development_sha" ]]; then
            echo "::error::development and master point to the same commit; nothing to release."
            exit 1
          fi

          comparison=$(gh api "repos/$REPOSITORY/compare/master...development")
          status=$(jq -r '.status' <<< "$comparison")
          ahead=$(jq -r '.ahead_by' <<< "$comparison")
          behind=$(jq -r '.behind_by' <<< "$comparison")

          if [[ "$status" != "ahead" || "$behind" != "0" || "$ahead" == "0" ]]; then
            echo "::error::Branches are not in a simple releasable state (status=$status, ahead=$ahead, behind=$behind)."
            exit 1
          fi

          pr_number=$(gh pr list --repo "$REPOSITORY" --state open \
            --base master --head development --json number --jq '.[0].number // empty')

          if [[ -z "$pr_number" ]]; then
            pr_url=$(gh pr create --repo "$REPOSITORY" \
              --base master --head development \
              --title "Release: merge development into master" \
              --body "Automated release PR. The release workflow merges this PR and creates the requested tag after a successful merge.")
            pr_number=${pr_url##*/}
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "master_sha=$master_sha" >> "$GITHUB_OUTPUT"
          echo "development_sha=$development_sha" >> "$GITHUB_OUTPUT"

      - name: Merge release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.development_sha }}
        run: |
          set -euo pipefail

          current_head=$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')
          if [[ "$current_head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::development changed after validation. Restart the release workflow."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --merge --delete-branch=false

      - name: Create tag on master merge commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # Re-check that the requested tag is still unused.
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$RELEASE_TAG' was created concurrently; refusing to overwrite it."
            exit 1
          fi

          # Resolve the completed PR's merge commit, then verify master is there.
          pr_number="${{ steps.pr.outputs.number }}"
          merge_sha=$(gh pr view "$pr_number" --repo "$REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')
          master_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/master" --jq '.object.sha')

          if [[ -z "$merge_sha" || "$master_sha" != "$merge_sha" ]]; then
            echo "::error::master does not point to the release PR merge commit; refusing to tag."
            exit 1
          fi

          gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$merge_sha"

          echo "Created $RELEASE_TAG at $merge_sha"
